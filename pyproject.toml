[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bgt-esre"
version = "0.1.0"
description = "Brain Graph Transformer with EcoSpace Rotary Encoding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.11,<2", "networkx>=3.2,<4",
  "scikit-learn>=1.3,<2", "torch>=2.2,<3", "torch-geometric>=2.5,<3",
  "PyYAML>=6,<7", "matplotlib>=3.8,<4",
]

[project.scripts]
bgt-esre = "bgt_esre.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["bgt_esre*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
