# Generic full BGT-ESRE configuration. Data locations are CLI arguments.
graph:
  measures: [ediff, comm]
  density: 0.15
  distance_decay: 0.1
  weighting: economy
  eps: 0.00000001
model:
  input_mode: bold
  hidden_dim: 64
  num_heads: 4
  num_layers: 3
  dropout: 0.1
  ffn_multiplier: 2
  cnn_kernels: [7, 5, 3]
  temporal_downsample: 4
  standardize_bold: true
  attention: rotary
training:
  folds: 5
  validation_fraction: 0.2
  epochs: 100
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.001
  patience: 15
  scheduler_patience: 10
  scheduler_factor: 0.5
  seed: 42
